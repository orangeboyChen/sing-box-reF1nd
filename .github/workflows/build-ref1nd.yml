name: Build Linux arm64

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name
        required: true
        type: string
      release:
        description: Create or update a draft prerelease
        required: true
        default: false
        type: boolean
  push:
    branches:
      - reF1nd-testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: true
      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(go run ./cmd/internal/read_tag --ci --nightly)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          BUILD_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0
        run: |
          mkdir -p dist/sing-box-${{ steps.version.outputs.version }}-linux-arm64
          go build -v -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ steps.version.outputs.version }}' $(cat release/LDFLAGS) -s -w -buildid=" \
            -o dist/sing-box-${{ steps.version.outputs.version }}-linux-arm64/sing-box ./cmd/sing-box
          cp LICENSE dist/sing-box-${{ steps.version.outputs.version }}-linux-arm64/
          tar -C dist -czf dist/sing-box-${{ steps.version.outputs.version }}-linux-arm64.tar.gz sing-box-${{ steps.version.outputs.version }}-linux-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64
          path: dist/sing-box-*-linux-arm64.tar.gz
      - name: Publish draft prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION#v}"
          gh release create "$TAG" dist/*.tar.gz --draft --prerelease --title "$TAG" || \
            gh release upload "$TAG" dist/*.tar.gz --clobber
